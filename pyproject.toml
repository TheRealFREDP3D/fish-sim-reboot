[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fish-sim-reboot"
version = "0.2.0"
description = "Underwater ecosystem simulation with neural network-driven fish"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "TheRealFREDP3D", email = ""}
]
dependencies = [
    "pygame>=2.5.0",
]

[project.scripts]
fish-sim = "fish_sim.main:run_simulation"

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true